name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: install dependencies
        run: python -m pip install requirements.txt

      - name: run tests
        run: python -m pytest -v
